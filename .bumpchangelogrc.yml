heading:
  style: setext
release:
  template: '[v{version}] | {date:YYYY-MM-DD}'
unreleased:
  template: '[Unreleased]'
  action: remove
reference:
  release:
    name: v{version}
    link: https://github.com/zokugun/node-fs-extra-plus/releases/tag/v{version}
  unreleased:
    link: https://github.com/zokugun/node-fs-extra-plus/compare/v{version}...HEAD
